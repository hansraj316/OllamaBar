# Builds OllamaBar.app on a macOS runner, ad-hoc signs it, zips it, and publishes
# a GitHub Release whenever a version tag (v*) is pushed. Can also be run by hand.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release)
        run: |
          xcodebuild -scheme OllamaBar -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Ad-hoc sign and zip
        run: |
          APP=build/Build/Products/Release/OllamaBar.app
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          ditto -c -k --keepParent "$APP" OllamaBar.zip
          shasum -a 256 OllamaBar.zip | tee OllamaBar.zip.sha256

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG" '
            /^## / { if (found) exit; if (index($0, "## " ver) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG section for $TAG; using commit list." >&2
            git log --oneline -20 > notes.md
          fi
          cat notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OllamaBar ${{ github.ref_name }}
          body_path: notes.md
          files: |
            OllamaBar.zip
            OllamaBar.zip.sha256
